; PlatformIO Project Configuration File — DIY Display Kit bench firmware
;
; STATUS: Week 1 bench proof-of-concept skeleton (sprint-roadmap.md Week 1,
; "Rapid Prototyper" trigger). Proves GC9A01 + LVGL bring-up on real ESP32
; hardware is possible — this has NOT been built/uploaded against real
; hardware in this session (no physical board or PlatformIO toolchain
; available here). See /firmware/README.md before treating anything here
; as verified-working.
;
; Board below is a generic ESP32 devkit placeholder. The team's actual
; prototype unit (ordered per roadmap Week 1 critical-path action) may be
; a different specific ESP32 board/module — swap `board` to match once
; that's known and Task 3.2 (pinout reference) is written against real
; hardware.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; Tells lvgl.h to pull in our project-local lv_conf.h (see include/lv_conf.h)
    ; instead of expecting it one directory above the library, which is the
    ; usual friction point when wiring LVGL into a PlatformIO project.
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl @ ^8.4.0
    ; --- Display driver choice: LovyanGFX (not Arduino_GFX) ---
    ; Both have working GC9A01 + LVGL bindings and either would work here.
    ; Picking LovyanGFX for this PoC because:
    ;   1. DMA-driven SPI writes — matters for keeping an LVGL UI responsive
    ;      on a single 240x240 round SPI panel on an ESP32 without hand-tuning
    ;      transfer code ourselves.
    ;   2. Its panel/bus config pattern (see src/main.cpp) keeps pin mapping
    ;      isolated in one small struct, which matters right now because the
    ;      real prototype's exact wiring isn't confirmed yet (Task 3.2 doesn't
    ;      exist as a doc yet) — swapping pins later is a one-block edit.
    ;   3. Widely used specifically for GC9A01 round modules in the maker
    ;      community, so troubleshooting references are easy to find for
    ;      whoever picks this up on the bench.
    ; If the team prefers Arduino_GFX's simpler API, swapping is a
    ; contained change: replace this lib_dep + the LGFX class block in
    ; main.cpp. The LVGL widget code and the serial-protocol stub below it
    ; are unaffected either way (that decoupling is the point of using
    ; LVGL at all — see architecture-stack-proposal.md §3, point 4).
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.2.0
